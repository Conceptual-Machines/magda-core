version: 2
updates:
  # Git submodules (JUCE, llama.cpp, etc.)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    # PRs go to main. ci.yml skips its build on dependabot/* heads, so the
    # self-hosted runners don't pick bumps up; run one through workflow_dispatch.
    schedule:
      interval: "weekly"
      day: "monday"
    # Security updates
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Same for Faust: our fork carries the wasmtime embedding patches
      # (WASMTIME_LIB/WASMTIME_INCLUDE_DIR + the raw calling convention for the
      # math imports). A Dependabot bump would move the pointer to an upstream
      # commit that lacks them and the build would stop configuring.
      - dependency-name: "third_party/faust"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    # Keep GitHub Actions up to date for security
    open-pull-requests-limit: 3
