name: Faust Vector Codegen Benchmark

# Measures scalar vs `-vec` Faust code generation for the compiled devices on
# each shipping platform (issue #1397).
#
# `-vec` emits no SIMD itself - it restructures the sample loop into a shape
# the host compiler can auto-vectorize. The whole win therefore depends on the
# compiler downstream, so clang/arm64 numbers say nothing about MSVC/x86_64.
# Hence one job per platform.
#
# Dispatch only, and it builds the Faust compiler plus one executable rather
# than MAGDA, so it runs on hosted runners and leaves the self-hosted ones free.

on:
  # Re-measure whenever the thing being measured moves: the DSP sources, the
  # codegen flags, or the benchmark itself. Also the only way to run this
  # before the workflow reaches main, since workflow_dispatch is refused for a
  # workflow that is not yet on the default branch.
  push:
    paths:
      - 'tools/faust_vec_bench/**'
      - '.github/workflows/faust-vec-bench.yml'
      - 'magda/daw/audio/faust_dsp/compiled/**'
      - 'magda/daw/audio/DevicesDependencies.cmake'
  workflow_dispatch:
    inputs:
      vector-size:
        description: 'Faust -vs vector size to test against scalar'
        required: false
        default: '4'
      block-size:
        description: 'Audio block size in samples'
        required: false
        default: '128'
      reps:
        description: 'Timed repetitions per variant (best wins)'
        required: false
        default: '7'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (clang)
            runner: macos-14
          - name: Linux x86_64 (gcc)
            runner: ubuntu-latest
          - name: Windows x86_64 (MSVC)
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Faust's submodule list pulls in Android/oboe, spectra and the CLAP SDK,
      # none of which the compiler needs. Only the standard library does.
      - name: Check out Faust and its standard library
        run: |
          git submodule update --init --depth 1 third_party/faust
          git -C third_party/faust submodule update --init --depth 1 libraries

      - name: Setup MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: |
          cmake -S tools/faust_vec_bench -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAGDA_FAUST_VECTOR_SIZE=${{ inputs.vector-size || '4' }}

      - name: Build
        run: cmake --build build-bench --target magda_faust_vec_bench

      - name: Run benchmark
        run: |
          binary=$(find build-bench -type f \
            \( -name 'magda_faust_vec_bench' -o -name 'magda_faust_vec_bench.exe' \) \
            | head -n1)
          if [ -z "$binary" ]; then
            echo "benchmark binary not found under build-bench"
            find build-bench -maxdepth 2 -type f | head -50
            exit 1
          fi

          "$binary" --block ${{ inputs.block-size || '128' }} --reps ${{ inputs.reps || '7' }} \
            | tee result.txt

          {
            echo "## ${{ matrix.name }}"
            echo
            cat result.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faust-vec-bench-${{ runner.os }}
          path: result.txt
