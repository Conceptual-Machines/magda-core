name: CI

on:
  push:
    # Never run CI on the Crowdin localization branch. The sync action recreates
    # that branch on top of the latest HEAD and force-pushes, so once the base
    # branch has advanced, the push diff carries real code and paths-ignore no
    # longer skips it. Excluding by branch name is the only reliable guard.
    # 'dependabot/**' so Dependabot bumps never auto-start CI (especially the
    # self-hosted macOS/Windows build jobs). Validate a bump on demand via the
    # workflow_dispatch button instead.
    branches-ignore: [ 'l10n_crowdin_**', 'dependabot/**' ]
    tags-ignore: [ '**' ]
    # Belt-and-suspenders: also skip when a push only touches translation files.
    paths-ignore:
      - 'lang/**'
      - 'manual/**'
      - 'docs/**'
      - '**/*.md'
  # Release PRs (dev/0.X.0 -> main): main's ruleset only accepts required
  # checks from PR-associated runs, so push-event and workflow_dispatch runs
  # never turn the merge box green. No paths filter: even a lang-only sync
  # merge moving the PR head must still report the required checks.
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      skip-cpp-build:
        description: 'Skip C++ build and test jobs'
        required: false
        type: boolean
        default: false

# Ensure only one CI run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: a0b1c8d3a477c1cb4813d8e127a56961707ca42b

jobs:
  # When a release PR into main is open for this branch, the pull_request run
  # owns validation (it is the only event the main ruleset accepts required
  # checks from), so the push run for the same commits stands down instead of
  # duplicating every build on the self-hosted runners. Fails open: any API
  # hiccup keeps the push run building.
  release-pr-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        proceed=true
        if [ "${{ github.event_name }}" = "push" ]; then
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
            --base main --state open --json number --jq length 2>/dev/null || echo 0)
          if [ -n "$count" ] && [ "$count" != "0" ]; then
            proceed=false
          fi
        fi
        echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  build-and-test-linux:
    needs: release-pr-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip C++ build/test when explicitly requested or when only non-C++ files changed
    if: |
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.skip-cpp-build != 'true') &&
      (github.event_name != 'push' ||
       needs.release-pr-gate.outputs.proceed == 'true')

    steps:
    # First step on purpose: this decides whether the whole job builds warm or
    # cold, so it belongs where it is visible without scrolling past the apt
    # output, and a credential problem surfaces before any setup time is spent.
    # Needs neither the checkout nor any package.
    - name: Check R2 credentials
      id: r2-creds
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      run: test -n "$R2_ACCESS_KEY_ID"

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true

    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install dependencies (Linux)
      run: |
        mkdir -p ~/apt-cache
        sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev \
          xvfb
        cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

    # Compile cache: sccache backed by Cloudflare R2 (see infra/sccache).
    # Replaces the actions/cache-backed ccache, which was branch-scoped and
    # shared the 10 GB per-repo cache budget, so ephemeral Linux runs were
    # almost always cold. The bucket is shared across runs/branches and
    # uncapped, so warm hits actually survive. The linux prefix is shared with
    # the JUCE-tests job so their common translation units hit each other's
    # objects.
    #
    # R2 rather than S3 because these runners are GitHub-hosted, so every cache
    # hit left AWS as billed egress: ~1.2 GB per job, ~356 GB and climbing in
    # the first month. R2 charges nothing for egress, which is the entire cost
    # of a cache that is working.
    #
    # R2 has no OIDC federation, so this uses a scoped API token instead of an
    # assumed role. Dependabot-triggered runs get no repo secrets, so the
    # first-step credential check fails and the build just runs cold (see the
    # sccache-gated launcher flags in Configure CMake below).
    - name: Setup sccache
      id: sccache
      if: steps.r2-creds.outcome == 'success'
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        SCCACHE_VERSION=v0.8.1
        curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
        sudo mv sccache-*/sccache /usr/local/bin/sccache
        sccache --version
        # sccache reads R2 through its S3 backend: bucket + custom endpoint,
        # region 'auto' (R2 has no regions), credentials via the standard AWS
        # variables. Written to GITHUB_ENV so the compile steps see them too.
        {
          echo "SCCACHE_BUCKET=${R2_BUCKET}"
          echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "SCCACHE_REGION=auto"
          echo "SCCACHE_S3_KEY_PREFIX=linux"
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
        } >> "$GITHUB_ENV"

    # Keyed by the CMake hash alone, no github.sha: actions/cache does not
    # re-save on a primary-key hit, so this saves once per CMake change
    # instead of once per push, and stops evicting the rest of the 10 GB
    # per-repo cache budget on every commit.
    - name: Cache CMake build directory
      uses: actions/cache@v6
      with:
        path: |
          build
          !build/tests/magda_tests
        key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-build-

    # Faust/Mutable prebuilt artifacts (#1669): both are stable, rarely-changing
    # vendored DSP deps that otherwise get rebuilt from source on every run of
    # every job that links magda_daw. Cache their final build outputs (fixed,
    # submodule-relative paths - see the top-level CMakeLists.txt) keyed on the
    # exact submodule revision + compiler + backend/build-type, with no
    # restore-keys fallback: an approximate match could silently restore an
    # artifact built with a different ABI, which is worse than a rebuild.
    - name: Determine Faust/Mutable artifact cache keys
      id: dsp-cache-keys
      run: |
        echo "faust_sha=$(git -C third_party/faust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "eurorack_sha=$(git -C third_party/eurorack rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(cc --version | head -n1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    # Same bucket as sccache/vcpkg, dsp/ prefix. actions/cache scopes a push
    # run's restores to its own branch plus main, so the first run on every
    # branch rebuilt Faust from source and stored another copy of the same
    # artifact against the shared 10 GB budget. R2 has no branch scoping; the
    # bucket's 14-day expiry bounds staleness.
    - name: Restore prebuilt Faust/Mutable artifacts (R2)
      id: dsp-r2
      if: steps.r2-creds.outcome == 'success'
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        # R2 rejects the trailing checksums newer AWS CLIs send by default.
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        fetch() {
          local key="$1" out="$2"
          if aws s3 cp "s3://${R2_BUCKET}/dsp/${key}.tar.gz" - --endpoint-url "$endpoint" --only-show-errors | tar -xzf - 2>/dev/null; then
            echo "${out}=true" >> "$GITHUB_OUTPUT"
            echo "restored ${key}"
          else
            echo "miss: ${key}"
          fi
        }
        fetch "${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug" faust_hit
        fetch "${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug" mutable_hit

    # Credential-less fallback (e.g. Dependabot): branch-scoped and duplicated,
    # but better than a guaranteed cold Faust build.
    - name: Cache prebuilt Faust artifact
      if: steps.r2-creds.outcome != 'success'
      id: faust-cache
      uses: actions/cache@v6
      with:
        path: |
          third_party/faust/build/bin
          third_party/faust/build/lib
        key: ${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug

    - name: Cache prebuilt Mutable artifact
      if: steps.r2-creds.outcome != 'success'
      id: mutable-cache
      uses: actions/cache@v6
      with:
        path: third_party/eurorack/build/lib
        key: ${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug

    # The launcher flags are always passed, with an explicit empty value in the
    # no-sccache case: the restored build/ cache carries CMakeCache.txt, and a
    # warm cache from a normal run has CMAKE_*_COMPILER_LAUNCHER=sccache baked
    # in. Omitting the -D flags would leave those cached values active with no
    # sccache binary installed, failing every compile; -DVAR= overrides them.
    - name: Configure CMake
      run: |
        "$GITHUB_WORKSPACE/scripts/ci-retry.sh" cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DMAGDA_BUILD_TESTS=ON \
          -DMAGDA_PRO_DEVICES=ON \
          "-DCMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" \
          "-DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" \
          ${{ (steps.dsp-r2.outputs.faust_hit == 'true' || steps.faust-cache.outputs.cache-hit == 'true') && format('-DMAGDA_FAUST_PREBUILT_DIR={0}/third_party/faust/build', github.workspace) || '' }} \
          ${{ (steps.dsp-r2.outputs.mutable_hit == 'true' || steps.mutable-cache.outputs.cache-hit == 'true') && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}/third_party/eurorack/build', github.workspace) || '' }}

    - name: Build
      run: |
        echo "Building with $(nproc) cores..."
        cmake --build build --config Debug -j$(nproc)

    - name: Populate prebuilt Faust/Mutable artifacts (R2)
      if: steps.r2-creds.outcome == 'success'
      continue-on-error: true
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        put() {
          local key="$1"; shift
          tar -czf - "$@" | aws s3 cp - "s3://${R2_BUCKET}/dsp/${key}.tar.gz" --endpoint-url "$endpoint" --only-show-errors
          echo "uploaded ${key}"
        }
        if [ "${{ steps.dsp-r2.outputs.faust_hit }}" != "true" ] && [ -d third_party/faust/build/bin ] && [ -d third_party/faust/build/lib ]; then
          put "${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug" \
            third_party/faust/build/bin third_party/faust/build/lib
        fi
        if [ "${{ steps.dsp-r2.outputs.mutable_hit }}" != "true" ] && [ -d third_party/eurorack/build/lib ]; then
          put "${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug" \
            third_party/eurorack/build/lib
        fi

    - name: Check build artifacts
      run: |
        echo "Checking build directory structure:"
        ls -la build/tests/ || echo "tests directory not found"
        find build -name "magda_tests" -type f || echo "magda_tests executable not found"

    - name: Run tests
      run: |
        if [ -f build/tests/magda_tests ]; then
          echo "Running tests..."
          cd build
          ./tests/magda_tests
        else
          echo "❌ Tests executable not found at build/tests/magda_tests"
          echo "Build directory contents:"
          find build -type f -name "*test*" || true
          exit 1
        fi

    - name: Show sccache statistics
      if: steps.sccache.outcome == 'success'
      run: sccache --show-stats

    - name: Test summary
      if: success()
      run: |
        echo "✅ Build and tests completed successfully on Linux"

  code-quality:
    needs: release-pr-gate
    runs-on: ubuntu-latest
    # Skip code quality checks when explicitly requested
    if: |
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.skip-cpp-build != 'true') &&
      (github.event_name != 'push' ||
       needs.release-pr-gate.outputs.proceed == 'true')

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true

    - name: Cache the pre-commit environment
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    # Formatting is checked with the clang-format version pinned in
    # .pre-commit-config.yaml, which is the same one the commit hook and
    # 'make format' now use. Installing the runner's own clang-format made this
    # job a third opinion: a different version over a narrower set of
    # directories than either of the other two, so it passed files the hook
    # would rewrite and never looked at magda/engine or magda/music at all.
    - name: Install pre-commit
      run: pipx install pre-commit

    - name: Check code formatting
      run: |
        echo "Checking code formatting with the pinned clang-format..."
        if pre-commit run clang-format --all-files --show-diff-on-failure; then
          echo "Format check passed!"
        else
          echo ""
          echo "To fix these issues, run: make format"
          exit 1
        fi

  security-checks:
    name: Security Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false  # Not needed for security checks

    - name: Check for hardcoded secrets patterns
      run: |
        echo "Checking for common secret patterns..."

        # Check for common secret patterns
        ISSUES_FOUND=0

        # API keys
        if grep -r "api[_-]key\s*=\s*['\"][a-zA-Z0-9]\{20,\}" magda/ tests/ --include="*.cpp" --include="*.hpp" --include="*.h" 2>/dev/null; then
          echo "⚠️  Found potential API key hardcoded"
          ISSUES_FOUND=1
        fi

        # Passwords
        if grep -r "password\s*=\s*['\"][^'\"]\{8,\}" magda/ tests/ --include="*.cpp" --include="*.hpp" --include="*.h" 2>/dev/null; then
          echo "⚠️  Found potential password hardcoded"
          ISSUES_FOUND=1
        fi

        # AWS keys
        if grep -r "AKIA[0-9A-Z]\{16\}" magda/ tests/ --include="*.cpp" --include="*.hpp" --include="*.h" 2>/dev/null; then
          echo "⚠️  Found potential AWS access key"
          ISSUES_FOUND=1
        fi

        # Private keys
        if grep -r "BEGIN.*PRIVATE KEY" magda/ tests/ --include="*.cpp" --include="*.hpp" --include="*.h" 2>/dev/null; then
          echo "⚠️  Found potential private key"
          ISSUES_FOUND=1
        fi

        if [ "$ISSUES_FOUND" -eq 1 ]; then
          echo ""
          echo "❌ Potential secrets detected! Please review and remove them."
          exit 1
        else
          echo "✅ No obvious secret patterns detected"
        fi

    - name: Check for dangerous C++ patterns
      run: |
        echo "Checking for dangerous C++ patterns..."

        ISSUES_FOUND=0

        # Unsafe C functions
        echo "Checking for unsafe C functions (strcpy, sprintf, gets)..."
        if grep -rE "\b(strcpy|sprintf|gets|scanf)\s*\(" magda/ tests/ --include="*.cpp" --include="*.hpp" 2>/dev/null; then
          echo "⚠️  Found unsafe C functions - use safe alternatives"
          ISSUES_FOUND=1
        fi

        # Potential command injection
        echo "Checking for potential command injection (system calls)..."
        if grep -rE "\bsystem\s*\(" magda/ tests/ --include="*.cpp" --include="*.hpp" 2>/dev/null | grep -v "// safe:" | grep -v "filesystem"; then
          echo "⚠️  Found system() calls - verify they are safe"
          ISSUES_FOUND=1
        fi

        if [ "$ISSUES_FOUND" -eq 1 ]; then
          echo ""
          echo "⚠️  Security issues detected - please review"
          echo "Note: These are warnings and won't fail the build, but should be reviewed"
        else
          echo "✅ No dangerous patterns detected"
        fi

    - name: Verify no binary files committed
      run: |
        echo "Checking for accidentally committed binary files..."

        # Check for common binary extensions that shouldn't be in source control
        BINARIES=$(find magda/ tests/ -type f \( \
          -name "*.exe" -o \
          -name "*.dll" -o \
          -name "*.so" -o \
          -name "*.dylib" -o \
          -name "*.a" -o \
          -name "*.lib" -o \
          -name "*.o" -o \
          -name "*.obj" \
        \) 2>/dev/null || true)

        if [ -n "$BINARIES" ]; then
          echo "❌ Found binary files that shouldn't be committed:"
          echo "$BINARIES"
          exit 1
        else
          echo "✅ No unexpected binary files found"
        fi

    - name: Security check summary
      run: |
        echo "## 🔒 Security Checks Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Secret pattern scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Dangerous pattern scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Binary file verification" >> $GITHUB_STEP_SUMMARY

  build-and-test-macos:
    needs: release-pr-gate
    runs-on: [self-hosted, macOS]
    if: |
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.skip-cpp-build != 'true') &&
      (github.event_name != 'push' ||
       needs.release-pr-gate.outputs.proceed == 'true')

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true

    - name: Init submodules
      run: git submodule update --init --recursive

    # Faust/Mutable prebuilt artifacts (#1669), self-hosted variant. This
    # runner's workspace persistence isn't reliable to depend on for these
    # (checkout may clean untracked/ignored files), so - like the vcpkg
    # binary cache above in the Windows job - stash the artifact in a fixed
    # directory outside the git workspace, keyed on submodule revision +
    # compiler + backend + build type, and reuse it directly as
    # MAGDA_*_PREBUILT_DIR rather than round-tripping through actions/cache.
    - name: Prepare prebuilt Faust/Mutable artifact cache (self-hosted)
      id: dsp-prebuilt
      run: |
        FAUST_SHA=$(git -C third_party/faust rev-parse HEAD)
        EURORACK_SHA=$(git -C third_party/eurorack rev-parse HEAD)
        COMPILER=$(cc --version | head -n1 | shasum | cut -c1-12)
        CACHE_ROOT="$HOME/magda-ci-cache"

        FAUST_DEBUG_DIR="$CACHE_ROOT/faust-artifact-${FAUST_SHA}-${COMPILER}-wasm-debug"
        FAUST_RELEASE_DIR="$CACHE_ROOT/faust-artifact-${FAUST_SHA}-${COMPILER}-wasm-release"
        MUTABLE_DEBUG_DIR="$CACHE_ROOT/mutable-artifact-${EURORACK_SHA}-${COMPILER}-debug"
        MUTABLE_RELEASE_DIR="$CACHE_ROOT/mutable-artifact-${EURORACK_SHA}-${COMPILER}-release"

        echo "faust_debug_dir=$FAUST_DEBUG_DIR" >> "$GITHUB_OUTPUT"
        echo "faust_release_dir=$FAUST_RELEASE_DIR" >> "$GITHUB_OUTPUT"
        echo "mutable_debug_dir=$MUTABLE_DEBUG_DIR" >> "$GITHUB_OUTPUT"
        echo "mutable_release_dir=$MUTABLE_RELEASE_DIR" >> "$GITHUB_OUTPUT"

        { [ -d "$FAUST_DEBUG_DIR/lib" ] && [ -d "$FAUST_DEBUG_DIR/bin" ] && echo "faust_debug_hit=true" >> "$GITHUB_OUTPUT"; } || true
        { [ -d "$FAUST_RELEASE_DIR/lib" ] && [ -d "$FAUST_RELEASE_DIR/bin" ] && echo "faust_release_hit=true" >> "$GITHUB_OUTPUT"; } || true
        { [ -d "$MUTABLE_DEBUG_DIR/lib" ] && echo "mutable_debug_hit=true" >> "$GITHUB_OUTPUT"; } || true
        { [ -d "$MUTABLE_RELEASE_DIR/lib" ] && echo "mutable_release_hit=true" >> "$GITHUB_OUTPUT"; } || true

    # Third-party source tarballs, self-hosted variant. build-debug and
    # build-release are deleted at the end of every run (the housekeeping step
    # below), so FetchContent downloads Lua and SQLite from their upstream
    # hosts again on every single run, and a run is then one outbound timeout
    # away from failing in configure over something the change under test never
    # touched. Not hypothetical: www.lua.org went unreachable from these
    # runners and took both native jobs down with it, while the Linux job on
    # another route passed the same commit.
    #
    # Same answer as the Faust artifacts above: a fixed directory outside the
    # git workspace, keyed on version, handed to CMake as the source it should
    # use rather than downloading one. FETCHCONTENT_SOURCE_DIR_<NAME> replaces
    # the download and nothing else, so each build tree keeps its own binary
    # dirs and the Debug and Release configures share one seed.
    #
    # Nothing is kept that does not match the hash CMakeLists.txt pins, and a
    # seed that cannot be fetched leaves its flag off rather than failing the
    # job: CMake then downloads it the way it always did.
    - name: Prepare third-party source cache (self-hosted)
      id: deps-cache
      # A step that exists to save a download must never be the reason a build
      # goes red. Everything below already degrades to letting CMake do the
      # downloading; this covers whatever is left.
      continue-on-error: true
      run: |
        set -uo pipefail
        CACHE_ROOT="$HOME/magda-ci-cache/deps"
        mkdir -p "$CACHE_ROOT"

        # seed <dir> <sha256> <archive> <url>...
        seed() {
          local dir="$1" sha="$2" archive="$3"
          shift 3

          if [ -d "$dir" ]; then
            echo "cached: $dir"
            return 0
          fi

          local work
          work="$(mktemp -d)"

          # A short connect timeout so a host that is being blackholed rather
          # than refusing costs seconds before the next URL is tried, instead
          # of however long this machine's TCP stack takes to give up.
          local fetched=""
          for url in "$@"; do
            if curl -sSfL --connect-timeout 30 --max-time 180 -o "$work/$archive" "$url"; then
              fetched="$url"
              break
            fi
            echo "could not fetch $url"
          done

          if [ -z "$fetched" ]; then
            echo "no source for $(basename "$dir"), leaving it to CMake"
            rm -rf "$work"
            return 1
          fi

          if ! echo "$sha  $work/$archive" | shasum -a 256 -c - >/dev/null; then
            echo "$fetched does not match the pinned hash, leaving it to CMake"
            rm -rf "$work"
            return 1
          fi

          mkdir -p "$work/extracted"
          case "$archive" in
            *.zip)    unzip -q "$work/$archive" -d "$work/extracted" ;;
            *.tar.xz) tar -xJf "$work/$archive" -C "$work/extracted" ;;
            *)        tar -xzf "$work/$archive" -C "$work/extracted" ;;
          esac

          # FetchContent hands its caller what is inside the archive rather
          # than the archive's own root, so the seed has to be the directory
          # it would have unpacked to and not the level above it.
          local top
          top="$(find "$work/extracted" -mindepth 1 -maxdepth 1)"
          if [ "$(printf '%s\n' "$top" | wc -l)" -ne 1 ]; then
            echo "$archive is not a single directory, leaving it to CMake"
            rm -rf "$work"
            return 1
          fi

          # Moved into place whole, so a directory that exists is a directory
          # that is complete: an interrupted run leaves nothing to trust.
          mv "$top" "$dir"
          rm -rf "$work"
          echo "seeded: $dir from $fetched"
        }

        LUA_DIR="$CACHE_ROOT/lua-5.4.7"
        SQLITE_DIR="$CACHE_ROOT/sqlite-amalgamation-3530100"

        seed "$LUA_DIR" \
          9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30 \
          lua-5.4.7.tar.gz \
          https://www.lua.org/ftp/lua-5.4.7.tar.gz \
          http://deb.debian.org/debian/pool/main/l/lua5.4/lua5.4_5.4.7.orig.tar.gz \
          && echo "lua_dir=$LUA_DIR" >> "$GITHUB_OUTPUT"

        # The SHA-256 of the zip CMakeLists.txt pins by its SHA3-256, which is
        # not a digest the tools on a runner can take. Both are of the same
        # file and a version bump changes both.
        seed "$SQLITE_DIR" \
          36ad6e7f38540a3b21a2ac36340833f0a9e426bc1c752751c3ba669466827eae \
          sqlite-amalgamation-3530100.zip \
          https://www.sqlite.org/2026/sqlite-amalgamation-3530100.zip \
          && echo "sqlite_dir=$SQLITE_DIR" >> "$GITHUB_OUTPUT"

        # wasmtime, and it is here for a sharper reason than saving a download.
        #
        # CMake's own downloader fails intermittently on this asset from this
        # machine: file(DOWNLOAD) gets "Server returned nothing (no headers, no
        # data)" following GitHub's redirect to release-assets.githubusercontent
        # .com, measured at roughly one attempt in five and much worse in bursts,
        # while curl fetches the same URL every time from the same shell a second
        # later. Retrying configure does not help when the burst outlasts the
        # attempts, and it cost this branch three red macOS runs.
        #
        # So the archive comes down through curl, which is reliable here, and
        # CMake is handed the unpacked tree instead of a URL.
        WASMTIME_VERSION=v47.0.2
        WASMTIME_ASSET=aarch64-macos-c-api
        WASMTIME_DIR="$CACHE_ROOT/wasmtime-$WASMTIME_VERSION-$WASMTIME_ASSET"

        seed "$WASMTIME_DIR" \
          c013fe243fd6e13cd63f13dcfa88c3aff5664e356181a2e1bda2c3bf8381fde0 \
          "wasmtime-$WASMTIME_VERSION-$WASMTIME_ASSET.tar.xz" \
          "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-$WASMTIME_ASSET.tar.xz" \
          && echo "wasmtime_dir=$WASMTIME_DIR" >> "$GITHUB_OUTPUT"

        # The ONNX Runtime, for the same reason: it is the other release asset
        # CMake fetches on this runner, and it failed the same way on the same
        # afternoon.
        ORT_VERSION=1.26.0
        ORT_DIR="$CACHE_ROOT/onnxruntime-osx-arm64-$ORT_VERSION"

        seed "$ORT_DIR" \
          7a1280bbb1701ea514f71828765237e7896e0f2e1cd332f1f70dbd5c3e33aca3 \
          "onnxruntime-osx-arm64-$ORT_VERSION.tgz" \
          "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz" \
          && echo "onnxruntime_dir=$ORT_DIR" >> "$GITHUB_OUTPUT"

        exit 0

    - name: Configure CMake (Debug)
      run: |
        "$GITHUB_WORKSPACE/scripts/ci-retry.sh" cmake -B build-debug -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DMAGDA_BUILD_TESTS=ON \
          ${{ steps.deps-cache.outputs.lua_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_LUA={0}', steps.deps-cache.outputs.lua_dir) || '' }} \
          ${{ steps.deps-cache.outputs.sqlite_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_SQLITE3={0}', steps.deps-cache.outputs.sqlite_dir) || '' }} \
          ${{ steps.deps-cache.outputs.wasmtime_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_WASMTIME={0}', steps.deps-cache.outputs.wasmtime_dir) || '' }} \
          ${{ steps.deps-cache.outputs.onnxruntime_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME={0}', steps.deps-cache.outputs.onnxruntime_dir) || '' }} \
          ${{ steps.dsp-prebuilt.outputs.faust_debug_hit == 'true' && format('-DMAGDA_FAUST_PREBUILT_DIR={0}', steps.dsp-prebuilt.outputs.faust_debug_dir) || '' }} \
          ${{ steps.dsp-prebuilt.outputs.mutable_debug_hit == 'true' && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}', steps.dsp-prebuilt.outputs.mutable_debug_dir) || '' }}

    - name: Build (Debug)
      run: cmake --build build-debug --config Debug

    # Populate the persistent artifact cache from this run's source build so
    # the next run on this runner can skip it. No-op on a cache hit (nothing
    # to refresh) or if the source build didn't happen to produce them.
    - name: Populate prebuilt Faust/Mutable cache (Debug)
      run: |
        if [ "${{ steps.dsp-prebuilt.outputs.faust_debug_hit }}" != "true" ] && [ -d third_party/faust/build/bin ] && [ -d third_party/faust/build/lib ]; then
          mkdir -p "${{ steps.dsp-prebuilt.outputs.faust_debug_dir }}"
          cp -R third_party/faust/build/bin "${{ steps.dsp-prebuilt.outputs.faust_debug_dir }}/"
          cp -R third_party/faust/build/lib "${{ steps.dsp-prebuilt.outputs.faust_debug_dir }}/"
        fi
        if [ "${{ steps.dsp-prebuilt.outputs.mutable_debug_hit }}" != "true" ] && [ -d third_party/eurorack/build/lib ]; then
          mkdir -p "${{ steps.dsp-prebuilt.outputs.mutable_debug_dir }}"
          cp -R third_party/eurorack/build/lib "${{ steps.dsp-prebuilt.outputs.mutable_debug_dir }}/"
        fi

    - name: Run tests
      run: |
        if [ -f build-debug/tests/magda_tests ]; then
          cd build-debug && ./tests/magda_tests
        else
          echo "❌ Tests executable not found"
          exit 1
        fi

    # JUCE integration tests are intentionally skipped on the macOS
    # self-hosted runner: SharedTestEngine calls the production
    # TracktionEngineWrapper::initialize(), which loads the runner host's
    # real ~/Library/MAGDA settings, opens real CoreAudio + MIDI devices,
    # and hangs on async playback-graph reallocation. Re-enable once the
    # engine has a sandboxed test-init path. Tracking: #1172.

    - name: Configure CMake (Release)
      run: |
        "$GITHUB_WORKSPACE/scripts/ci-retry.sh" cmake -B build-release -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DMAGDA_BUILD_TESTS=OFF \
          ${{ steps.deps-cache.outputs.lua_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_LUA={0}', steps.deps-cache.outputs.lua_dir) || '' }} \
          ${{ steps.deps-cache.outputs.sqlite_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_SQLITE3={0}', steps.deps-cache.outputs.sqlite_dir) || '' }} \
          ${{ steps.deps-cache.outputs.wasmtime_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_WASMTIME={0}', steps.deps-cache.outputs.wasmtime_dir) || '' }} \
          ${{ steps.deps-cache.outputs.onnxruntime_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME={0}', steps.deps-cache.outputs.onnxruntime_dir) || '' }} \
          ${{ steps.dsp-prebuilt.outputs.faust_release_hit == 'true' && format('-DMAGDA_FAUST_PREBUILT_DIR={0}', steps.dsp-prebuilt.outputs.faust_release_dir) || '' }} \
          ${{ steps.dsp-prebuilt.outputs.mutable_release_hit == 'true' && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}', steps.dsp-prebuilt.outputs.mutable_release_dir) || '' }}

    - name: Build (Release)
      run: cmake --build build-release --config Release

    - name: Populate prebuilt Faust/Mutable cache (Release)
      run: |
        if [ "${{ steps.dsp-prebuilt.outputs.faust_release_hit }}" != "true" ] && [ -d third_party/faust/build/bin ] && [ -d third_party/faust/build/lib ]; then
          mkdir -p "${{ steps.dsp-prebuilt.outputs.faust_release_dir }}"
          cp -R third_party/faust/build/bin "${{ steps.dsp-prebuilt.outputs.faust_release_dir }}/"
          cp -R third_party/faust/build/lib "${{ steps.dsp-prebuilt.outputs.faust_release_dir }}/"
        fi
        if [ "${{ steps.dsp-prebuilt.outputs.mutable_release_hit }}" != "true" ] && [ -d third_party/eurorack/build/lib ]; then
          mkdir -p "${{ steps.dsp-prebuilt.outputs.mutable_release_dir }}"
          cp -R third_party/eurorack/build/lib "${{ steps.dsp-prebuilt.outputs.mutable_release_dir }}/"
        fi

    - name: Verify app bundle
      run: |
        APP_PATH="build-release/magda/daw/magda_daw_app_artefacts/Release/MAGDA.app"
        if [ -d "$APP_PATH" ]; then
          echo "✅ MAGDA.app built successfully"
          ls -la "$APP_PATH/Contents/MacOS/"
        else
          echo "❌ MAGDA.app not found"
          exit 1
        fi

    - name: Clean up build directories
      if: always()
      run: |
        # On the persistent self-hosted macOS runner, a plain `rm -rf` on the
        # fresh build dirs intermittently fails with "Directory not empty":
        # Spotlight (mdworker) indexes the just-built .app bundles and recreates
        # an entry between rm's unlink pass and its final rmdir (a TOCTOU race
        # ephemeral GitHub-hosted runners never hit). Rename aside first - an
        # atomic mv, so nothing can write into the new path - then delete, and
        # never let housekeeping fail an otherwise-green build.
        for d in build-debug build-release; do
          [ -e "$d" ] && mv "$d" "$d.trash.$$" 2>/dev/null || true
        done
        rm -rf build-debug build-release build-*.trash.* 2>/dev/null || true
        exit 0

    - name: Build summary
      if: success()
      run: echo "✅ macOS build and tests completed successfully"

  # Decide whether the Windows job runs on the self-hosted runner (magda-luca)
  # or falls back to windows-latest. The self-hosted runner is preferred only
  # when it is online and idle; otherwise use the GitHub-hosted runner so PRs
  # do not block behind a busy/offline local machine.
  pick-windows-runner:
    needs: release-pr-gate
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.skip-cpp-build != 'true') &&
      (github.event_name != 'push' ||
       needs.release-pr-gate.outputs.proceed == 'true')
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - name: Pick Windows runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'labels=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "No RUNNER_STATUS_PAT available in this context (e.g. Dependabot PRs do not see repo secrets); falling back to windows-latest"
            exit 0
          fi

          runner=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '.runners[] | select(any(.labels[]; .name == "magda-luca")) | [.status, .busy] | @tsv' \
            | head -n1 || true)

          status=$(printf '%s' "$runner" | cut -f1)
          busy=$(printf '%s' "$runner" | cut -f2)

          # The runner only reports busy=true once a job has actually landed on
          # it. This pick job runs at the very start of the workflow, long before
          # the Windows build job dispatches, so two CI runs starting close
          # together both see busy=false and both target magda-luca - the second
          # then queues behind the first instead of falling back. Guard against
          # that by also falling back when any other CI run is already in flight.
          # Count every run that is not yet completed (queued/in_progress/
          # waiting/...): a competing run can still be queued, not in_progress,
          # at the moment this step executes, and it has already picked a runner.
          inflight=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status != \"completed\")] | length" 2>/dev/null || echo "unknown")

          if [ "$status" = "online" ] && [ "$busy" != "true" ] && [ "$inflight" = "0" ]; then
            echo 'labels=["self-hosted","Windows","magda-luca"]' >> "$GITHUB_OUTPUT"
            echo "Using idle self-hosted runner: magda-luca"
          else
            echo 'labels=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "Falling back to windows-latest (magda-luca status: '${status:-not-found}', busy: '${busy:-unknown}', inflight runs: '${inflight}')"
          fi

  build-and-test-windows:
    needs: pick-windows-runner
    runs-on: ${{ fromJSON(needs.pick-windows-runner.outputs.labels) }}
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.skip-cpp-build != 'true'

    steps:
    # First step on purpose, mirrors the Linux job: decides whether this run
    # gets sccache and the vcpkg R2 binary cache, or falls back to an
    # uncached build. Needs neither the checkout nor any tool.
    - name: Check R2 credentials
      id: r2-creds
      continue-on-error: true
      shell: powershell
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      run: |
        if ([string]::IsNullOrEmpty($env:R2_ACCESS_KEY_ID)) { exit 1 }

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true

    - name: Setup MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # vcpkg + its binary cache. On the self-hosted runner both persist on the
    # machine across runs: a fixed clone we re-checkout (not re-clone), and a
    # fixed binary cache dir, so libxml2 is restored from cache instead of being
    # recompiled (that ~10 min build only happens on the very first run / after a
    # pin bump). On GitHub-hosted runners the VM is ephemeral, so clone into
    # RUNNER_TEMP and let actions/cache carry the binary cache between runs.
    # vcpkg.exe comes from a GitHub release, fetched by vcpkg's own bootstrap
    # over WinHttp, and that fetch has failed this job outright: "the server
    # returned an invalid or unrecognized response". It is the same shape as the
    # asset failures on macOS, where CMake's downloader came back empty from
    # GitHub while curl never did.
    #
    # A hosted runner keeps nothing between runs, so the tool is fetched again
    # every time and every run gets another chance to lose. Cached, it is fetched
    # once per pinned vcpkg commit and the bootstrap is skipped from then on.
    - name: Cache the vcpkg tool
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\vcpkg-tool
        key: ${{ runner.os }}-vcpkg-tool-${{ env.VCPKG_COMMIT }}

    - name: Setup vcpkg
      shell: powershell
      run: |
        if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') {
          $vcpkgRoot = 'C:\vcpkg-ci'
          $binCache  = 'C:\vcpkg-bincache'
        } else {
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $binCache  = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-binary-cache'
        }
        if (-not (Test-Path "$vcpkgRoot\.git")) {
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
        }
        # Fetch only when the pinned commit isn't already present (i.e. a pin bump).
        git -C $vcpkgRoot cat-file -e "$($env:VCPKG_COMMIT)^{commit}"
        if ($LASTEXITCODE -ne 0) { git -C $vcpkgRoot fetch origin }
        git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
        # Whether there is a working tool at this path, which is not the same
        # question as whether the path exists. bootstrap downloads straight to
        # its destination, so an interrupted transfer leaves a prefix of an
        # executable behind, and every later check that only looks for the file
        # would accept it: the retry would stop early, and the cache would keep
        # it for every run on this key from then on. Running it is the cheapest
        # thing that cannot be fooled that way, and it is what bootstrap itself
        # finishes with.
        function Test-VcpkgTool($exe) {
          if (-not (Test-Path $exe)) { return $false }
          try {
            & $exe version --disable-metrics | Out-Null
            return ($LASTEXITCODE -eq 0)
          } catch {
            return $false
          }
        }

        # An executable already at the root is trusted only once it has run.
        # That path survives every run on the self-hosted machine, including one
        # where the last bootstrap attempt left a partial download there before
        # this step gave up, so a file that merely exists would skip the cache
        # restore and the retry loop both, and get copied into the tool cache on
        # its way to failing at vcpkg install instead.
        if ((Test-Path "$vcpkgRoot\vcpkg.exe") -and
            (-not (Test-VcpkgTool "$vcpkgRoot\vcpkg.exe"))) {
          Write-Host "the vcpkg.exe already present does not run, discarding it"
          Remove-Item "$vcpkgRoot\vcpkg.exe" -Force -ErrorAction SilentlyContinue
        }

        # The tool this runner already fetched, put back before anything asks to
        # download it again. See "Cache the vcpkg tool" above.
        $toolCache = Join-Path $env:RUNNER_TEMP 'vcpkg-tool'
        if ((-not (Test-Path "$vcpkgRoot\vcpkg.exe")) -and (Test-Path "$toolCache\vcpkg.exe")) {
          Copy-Item "$toolCache\vcpkg.exe" "$vcpkgRoot\vcpkg.exe" -Force
          if (Test-VcpkgTool "$vcpkgRoot\vcpkg.exe") {
            Write-Host "vcpkg.exe restored from the tool cache"
          } else {
            Write-Host "the cached vcpkg.exe does not run, bootstrapping instead"
            Remove-Item "$vcpkgRoot\vcpkg.exe" -Force -ErrorAction SilentlyContinue
          }
        }

        if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
          # Retried, because the download inside it is the flaky part and a
          # second attempt half a minute later is usually enough.
          $bootstrapped = $false
          foreach ($attempt in 1..3) {
            # Cleared first, so a half-written file from the attempt before
            # cannot be inherited and mistaken for this one succeeding.
            Remove-Item "$vcpkgRoot\vcpkg.exe" -Force -ErrorAction SilentlyContinue

            $status = 1
            try {
              & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
              $status = $LASTEXITCODE
            } catch {
              Write-Host "vcpkg bootstrap threw: $_"
            }

            if ($status -eq 0 -and (Test-VcpkgTool "$vcpkgRoot\vcpkg.exe")) {
              $bootstrapped = $true
              break
            }

            Write-Host "vcpkg bootstrap attempt $attempt failed (exit $status)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }

          if (-not $bootstrapped) {
            # So the next run starts from nothing rather than from whatever the
            # last attempt managed to write.
            Remove-Item "$vcpkgRoot\vcpkg.exe" -Force -ErrorAction SilentlyContinue
            throw 'vcpkg bootstrap failed after 3 attempts'
          }
        }

        # Kept for the next run on this runner, and only once it has run here.
        New-Item -ItemType Directory -Force -Path $toolCache | Out-Null
        Copy-Item "$vcpkgRoot\vcpkg.exe" "$toolCache\vcpkg.exe" -Force

        New-Item -ItemType Directory -Force -Path $binCache | Out-Null
        "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_DEFAULT_BINARY_CACHE=$binCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # vcpkg's S3-compatible binary source, pointed at the same R2 bucket
    # sccache uses (see infra/sccache/README.md), under a vcpkg/ prefix.
    # Replaces the actions/cache-backed package cache, which shared the same
    # evicted 10 GB budget as everything else. Needs the AWS CLI, which
    # windows-latest ships and the self-hosted runner may not; where it's
    # missing this is a no-op and vcpkg keeps using its local disk cache
    # (VCPKG_DEFAULT_BINARY_CACHE, set above). The bucket's 14-day expiry
    # applies here too, so libxml2 rebuilds from source at most every two
    # weeks on the runner that lacks the AWS CLI.
    - name: Setup vcpkg binary cache (R2)
      if: steps.r2-creds.outcome == 'success'
      shell: powershell
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
          Write-Host "AWS CLI not found, skipping the vcpkg R2 binary cache"
          exit 0
        }
        # 'default' keeps the local disk cache in front of R2, which is what
        # the self-hosted runner already has warm.
        "VCPKG_BINARY_SOURCES=default,readwrite;x-aws,s3://$env:R2_BUCKET/vcpkg/,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_ENDPOINT_URL=https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_DEFAULT_REGION=auto" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # Newer AWS CLIs send trailing checksums by default, which R2's S3 API
        # does not accept on every operation; when_required is the older behaviour.
        "AWS_REQUEST_CHECKSUM_CALCULATION=when_required" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_ACCESS_KEY_ID=$env:R2_ACCESS_KEY_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_SECRET_ACCESS_KEY=$env:R2_SECRET_ACCESS_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install libxml2
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

    # Compile cache: sccache backed by Cloudflare R2 (see infra/sccache),
    # replacing ccache. ccache was branch-scoped via actions/cache and shared
    # the repo's 10 GB budget with everything else, so most Windows runs built
    # cold. Same bucket as Linux, windows key prefix so objects don't collide.
    # MSVC Debug already builds with /Z7 (see CMakeLists.txt), which is what
    # makes these objects cacheable at all - /Zi cannot be cached.
    - name: Setup sccache
      id: sccache
      if: steps.r2-creds.outcome == 'success'
      shell: powershell
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        $SCCACHE_VERSION = "v0.8.1"
        $archive = "sccache-$SCCACHE_VERSION-x86_64-pc-windows-msvc.tar.gz"
        # Into RUNNER_TEMP, not the checkout: the self-hosted workspace persists.
        $dest = Join-Path $env:RUNNER_TEMP "sccache"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        curl.exe -fsSL "https://github.com/mozilla/sccache/releases/download/$SCCACHE_VERSION/$archive" -o (Join-Path $dest $archive)
        tar.exe xf (Join-Path $dest $archive) -C $dest
        $sccacheDir = (Get-ChildItem -Path $dest -Directory -Filter "sccache-$SCCACHE_VERSION-*").FullName
        Add-Content -Path $env:GITHUB_PATH -Value $sccacheDir
        & "$sccacheDir\sccache.exe" --version
        # A server left running from an earlier run on the self-hosted runner
        # keeps that run's config; stop it so this run's env is what starts it.
        # Under the runner's ErrorActionPreference=Stop, native stderr through a
        # redirect is a terminating error, so relax it for this one call.
        $ErrorActionPreference = 'Continue'
        & "$sccacheDir\sccache.exe" --stop-server 2>&1 | Out-Null
        $ErrorActionPreference = 'Stop'
        $global:LASTEXITCODE = 0
        # sccache reads R2 through its S3 backend: bucket + custom endpoint,
        # region 'auto' (R2 has no regions), credentials via the standard AWS
        # variables. Written to GITHUB_ENV so the compile steps see them too.
        "SCCACHE_BUCKET=$env:R2_BUCKET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SCCACHE_ENDPOINT=https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SCCACHE_REGION=auto" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SCCACHE_S3_KEY_PREFIX=windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_ACCESS_KEY_ID=$env:R2_ACCESS_KEY_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "AWS_SECRET_ACCESS_KEY=$env:R2_SECRET_ACCESS_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Determine Faust/Mutable artifact cache keys
      id: dsp-cache-keys
      shell: powershell
      run: |
        # actions/checkout registers the top-level repo as a git safe.directory
        # automatically, but not nested submodule paths. On this self-hosted
        # runner the checkout and this step run under different Windows
        # accounts, so `git -C third_party/faust ...` below would otherwise
        # fail with "detected dubious ownership". Wildcard avoids hardcoding
        # a workspace path that differs between the self-hosted runner and
        # the windows-latest fallback.
        git config --global --add safe.directory "*"
        $faustSha = (git -C third_party/faust rev-parse HEAD).Trim()
        $eurorackSha = (git -C third_party/eurorack rev-parse HEAD).Trim()
        $compiler = if ($env:VCToolsVersion) { $env:VCToolsVersion } else { "unknown" }
        echo "faust_sha=$faustSha" >> $env:GITHUB_OUTPUT
        echo "eurorack_sha=$eurorackSha" >> $env:GITHUB_OUTPUT
        echo "compiler=$compiler" >> $env:GITHUB_OUTPUT

    # Faust/Mutable prebuilt artifacts (#1669). Same self-hosted-vs-hosted
    # split as the vcpkg binary cache above: a fixed local dir on the
    # persistent self-hosted runner (no upload/download round-trip needed),
    # actions/cache on the ephemeral windows-latest fallback. Release only
    # ever runs on self-hosted (see its `if:` below), so it only needs the
    # self-hosted branch's dirs.
    - name: Prepare prebuilt Faust/Mutable artifact cache (self-hosted)
      if: runner.environment == 'self-hosted'
      id: dsp-prebuilt-self
      shell: powershell
      run: |
        $cacheRoot = 'C:\magda-ci-cache'
        $faustDebugDir = "$cacheRoot\faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug"
        $faustReleaseDir = "$cacheRoot\faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-release"
        $mutableDebugDir = "$cacheRoot\mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug"
        $mutableReleaseDir = "$cacheRoot\mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-release"

        echo "faust_debug_dir=$faustDebugDir" >> $env:GITHUB_OUTPUT
        echo "faust_release_dir=$faustReleaseDir" >> $env:GITHUB_OUTPUT
        echo "mutable_debug_dir=$mutableDebugDir" >> $env:GITHUB_OUTPUT
        echo "mutable_release_dir=$mutableReleaseDir" >> $env:GITHUB_OUTPUT

        if ((Test-Path "$faustDebugDir\lib") -and (Test-Path "$faustDebugDir\bin")) { echo "faust_debug_hit=true" >> $env:GITHUB_OUTPUT }
        if ((Test-Path "$faustReleaseDir\lib") -and (Test-Path "$faustReleaseDir\bin")) { echo "faust_release_hit=true" >> $env:GITHUB_OUTPUT }
        if (Test-Path "$mutableDebugDir\lib") { echo "mutable_debug_hit=true" >> $env:GITHUB_OUTPUT }
        if (Test-Path "$mutableReleaseDir\lib") { echo "mutable_release_hit=true" >> $env:GITHUB_OUTPUT }

    # Same bucket as sccache/vcpkg, dsp/ prefix; see the Linux job's twin step
    # for why actions/cache alone rebuilt Faust on every new branch. Temp files
    # rather than pipes: PowerShell pipelines corrupt binary streams.
    - name: Restore prebuilt Faust/Mutable artifacts (R2, github-hosted)
      id: dsp-r2-hosted
      if: runner.environment == 'github-hosted' && steps.r2-creds.outcome == 'success'
      shell: powershell
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
          Write-Host "AWS CLI not found, skipping the R2 artifact cache"
          exit 0
        }
        # A miss is normal, never a step failure.
        $ErrorActionPreference = 'Continue'
        $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        function Restore-Artifact([string]$key, [string]$out) {
          $tmp = Join-Path $env:RUNNER_TEMP "$key.tar.gz"
          aws s3 cp "s3://$env:R2_BUCKET/dsp/$key.tar.gz" $tmp --endpoint-url $endpoint --only-show-errors
          if ($LASTEXITCODE -eq 0 -and (Test-Path $tmp)) {
            tar.exe -xzf $tmp
            if ($LASTEXITCODE -eq 0) {
              echo "$out=true" >> $env:GITHUB_OUTPUT
              Write-Host "restored $key"
              return
            }
          }
          Write-Host "miss: $key"
          $global:LASTEXITCODE = 0
        }
        Restore-Artifact "${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug" "faust_hit"
        Restore-Artifact "${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug" "mutable_hit"

    # Credential-less fallback (e.g. Dependabot): branch-scoped and duplicated,
    # but better than a guaranteed cold Faust build.
    - name: Cache prebuilt Faust artifact (github-hosted)
      if: runner.environment == 'github-hosted' && steps.r2-creds.outcome != 'success'
      id: faust-cache-hosted
      uses: actions/cache@v6
      with:
        path: |
          third_party/faust/build/bin
          third_party/faust/build/lib
        key: ${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug

    - name: Cache prebuilt Mutable artifact (github-hosted)
      if: runner.environment == 'github-hosted' && steps.r2-creds.outcome != 'success'
      id: mutable-cache-hosted
      uses: actions/cache@v6
      with:
        path: third_party/eurorack/build/lib
        key: ${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug

    # The macOS job's third-party source cache, in PowerShell. Same reason and
    # same shape: the build dirs go at the end of every run, so Lua and SQLite
    # would be downloaded again on every one, and www.lua.org going unreachable
    # has already failed this job in configure. On the github-hosted fallback
    # runner nothing persists between runs, so this simply does the download
    # CMake would have done and costs nothing either way.
    #
    # No shell key, so this runs in whatever the job's other steps run in.
    # Naming pwsh explicitly fails outright on a runner that only has Windows
    # PowerShell, where the default falls back to it; and continue-on-error
    # because a step that exists to save a download must never be the reason a
    # build goes red.
    - name: Prepare third-party source cache
      id: deps-cache
      continue-on-error: true
      run: |
        # Windows PowerShell 5.1 negotiates TLS 1.0 by default, which every
        # host here refused years ago, and draws a progress bar for every
        # buffer it reads, which is worth an order of magnitude on a download
        # this size.
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $ProgressPreference = 'SilentlyContinue'

        $cacheRoot = Join-Path $HOME 'magda-ci-cache\deps'
        New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null

        function Seed($dir, $sha, $archive, $urls) {
            if (Test-Path $dir) {
                Write-Host "cached: $dir"
                return $true
            }

            $work = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $work | Out-Null
            $file = Join-Path $work $archive

            $fetched = ''
            foreach ($url in $urls) {
                try {
                    Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -TimeoutSec 180
                    $fetched = $url
                    break
                } catch {
                    Write-Host "could not fetch $url"
                }
            }

            if (-not $fetched) {
                Write-Host "no source for $dir, leaving it to CMake"
                Remove-Item -Recurse -Force $work
                return $false
            }

            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $sha.ToUpper()) {
                Write-Host "$fetched does not match the pinned hash, leaving it to CMake"
                Remove-Item -Recurse -Force $work
                return $false
            }

            $extracted = Join-Path $work 'extracted'
            New-Item -ItemType Directory -Force -Path $extracted | Out-Null

            # bsdtar, which ships with Windows and reads both the tarball and
            # the zip.
            tar -xf $file -C $extracted

            # FetchContent hands its caller what is inside the archive rather
            # than the archive's own root, so the seed has to be the directory
            # it would have unpacked to and not the level above it.
            $top = @(Get-ChildItem $extracted)
            if ($top.Count -ne 1) {
                Write-Host "$archive is not a single directory, leaving it to CMake"
                Remove-Item -Recurse -Force $work
                return $false
            }

            # Moved into place whole, so a directory that exists is a directory
            # that is complete.
            Move-Item $top[0].FullName $dir
            Remove-Item -Recurse -Force $work
            Write-Host "seeded: $dir from $fetched"
            return $true
        }

        $luaDir = Join-Path $cacheRoot 'lua-5.4.7'
        $sqliteDir = Join-Path $cacheRoot 'sqlite-amalgamation-3530100'

        # Written through .NET rather than Out-File: Windows PowerShell writes
        # UTF-16 there and the runner reads the file as UTF-8.
        if (Seed $luaDir '9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30' 'lua-5.4.7.tar.gz' @(
                'https://www.lua.org/ftp/lua-5.4.7.tar.gz',
                'http://deb.debian.org/debian/pool/main/l/lua5.4/lua5.4_5.4.7.orig.tar.gz')) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "lua_dir=$luaDir`n")
        }

        # The SHA-256 of the zip CMakeLists.txt pins by its SHA3-256, which is
        # not a digest the tools on a runner can take. Both are of the same
        # file and a version bump changes both.
        if (Seed $sqliteDir '36ad6e7f38540a3b21a2ac36340833f0a9e426bc1c752751c3ba669466827eae' 'sqlite-amalgamation-3530100.zip' @(
                'https://www.sqlite.org/2026/sqlite-amalgamation-3530100.zip')) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sqlite_dir=$sqliteDir`n")
        }

        exit 0

    - name: Configure CMake (Debug)
      run: |
        cmake -B build-debug -G Ninja `
          -DCMAKE_BUILD_TYPE=Debug `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
          -DMAGDA_BUILD_TESTS=ON `
          ${{ steps.deps-cache.outputs.lua_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_LUA={0}', steps.deps-cache.outputs.lua_dir) || '' }} `
          ${{ steps.deps-cache.outputs.sqlite_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_SQLITE3={0}', steps.deps-cache.outputs.sqlite_dir) || '' }} `
          "-DCMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" `
          "-DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          ${{ (steps.dsp-prebuilt-self.outputs.faust_debug_hit == 'true' && format('-DMAGDA_FAUST_PREBUILT_DIR={0}', steps.dsp-prebuilt-self.outputs.faust_debug_dir)) || ((steps.dsp-r2-hosted.outputs.faust_hit == 'true' || steps.faust-cache-hosted.outputs.cache-hit == 'true') && format('-DMAGDA_FAUST_PREBUILT_DIR={0}/third_party/faust/build', github.workspace)) || '' }} `
          ${{ (steps.dsp-prebuilt-self.outputs.mutable_debug_hit == 'true' && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}', steps.dsp-prebuilt-self.outputs.mutable_debug_dir)) || ((steps.dsp-r2-hosted.outputs.mutable_hit == 'true' || steps.mutable-cache-hosted.outputs.cache-hit == 'true') && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}/third_party/eurorack/build', github.workspace)) || '' }}

    # Scoped to magda_tests only: this job doesn't otherwise need
    # magda_daw_app built during the Debug pass, and the Release pass below
    # already builds + verifies the full app on self-hosted, so no app-build
    # coverage is lost. Windows is the slow platform here (no sccache hits
    # can help what never gets compiled), so this is worth it; macOS is fast
    # enough already that the same scoping wasn't applied there.
    - name: Build (Debug)
      run: cmake --build build-debug --config Debug --target magda_tests

    - name: Populate prebuilt Faust/Mutable cache (Debug, self-hosted)
      if: runner.environment == 'self-hosted'
      shell: powershell
      run: |
        if ("${{ steps.dsp-prebuilt-self.outputs.faust_debug_hit }}" -ne "true" -and (Test-Path "third_party\faust\build\bin") -and (Test-Path "third_party\faust\build\lib")) {
          New-Item -ItemType Directory -Force -Path "${{ steps.dsp-prebuilt-self.outputs.faust_debug_dir }}" | Out-Null
          Copy-Item -Recurse -Force "third_party\faust\build\bin" "${{ steps.dsp-prebuilt-self.outputs.faust_debug_dir }}\"
          Copy-Item -Recurse -Force "third_party\faust\build\lib" "${{ steps.dsp-prebuilt-self.outputs.faust_debug_dir }}\"
        }
        if ("${{ steps.dsp-prebuilt-self.outputs.mutable_debug_hit }}" -ne "true" -and (Test-Path "third_party\eurorack\build\lib")) {
          New-Item -ItemType Directory -Force -Path "${{ steps.dsp-prebuilt-self.outputs.mutable_debug_dir }}" | Out-Null
          Copy-Item -Recurse -Force "third_party\eurorack\build\lib" "${{ steps.dsp-prebuilt-self.outputs.mutable_debug_dir }}\"
        }

    - name: Populate prebuilt Faust/Mutable artifacts (R2, github-hosted)
      if: runner.environment == 'github-hosted' && steps.r2-creds.outcome == 'success'
      continue-on-error: true
      shell: powershell
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        if (-not (Get-Command aws -ErrorAction SilentlyContinue)) { exit 0 }
        $ErrorActionPreference = 'Continue'
        $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        function Publish-Artifact([string]$key, [string[]]$paths) {
          $tmp = Join-Path $env:RUNNER_TEMP "$key.up.tar.gz"
          tar.exe -czf $tmp @paths
          if ($LASTEXITCODE -eq 0) {
            aws s3 cp $tmp "s3://$env:R2_BUCKET/dsp/$key.tar.gz" --endpoint-url $endpoint --only-show-errors
            Write-Host "uploaded $key"
          }
        }
        if ("${{ steps.dsp-r2-hosted.outputs.faust_hit }}" -ne "true" -and (Test-Path "third_party\faust\build\bin") -and (Test-Path "third_party\faust\build\lib")) {
          Publish-Artifact "${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug" @("third_party/faust/build/bin", "third_party/faust/build/lib")
        }
        if ("${{ steps.dsp-r2-hosted.outputs.mutable_hit }}" -ne "true" -and (Test-Path "third_party\eurorack\build\lib")) {
          Publish-Artifact "${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug" @("third_party/eurorack/build/lib")
        }

    - name: Show sccache statistics
      if: steps.sccache.outcome == 'success'
      shell: powershell
      run: sccache --show-stats

    # A timeout is here to catch a hang, not to enforce a performance budget.
    # At five minutes it was doing the second job badly: the last green run on
    # dev finished this step in 4:53, so any test added anywhere in the suite
    # failed Windows and nowhere else, with a timeout for a message.
    #
    # Fifteen went the same way. The suite reached 11:32 on dev, and the next
    # test matrix added anywhere took it over, again on Windows and nowhere
    # else. Debug MSVC runs this suite about ten times slower than a Debug
    # clang build does, so this is the step that meets every addition first.
    # Thirty still kills a hang long before the job's own limit, and leaves the
    # suite room to grow without the gate reading "timed out" for "slower".
    - name: Run tests
      timeout-minutes: 30
      run: |
        $testExe = Get-ChildItem -Path build-debug -Recurse -Filter "magda_tests.exe" | Select-Object -First 1
        if ($testExe) {
          & $testExe.FullName --abort
        } else {
          Write-Error "Tests executable not found"
          exit 1
        }

    # Release configure/build/verify only run on push to main, and only on the
    # self-hosted runner (magda-luca). Feature-branch pushes get Debug coverage;
    # the Release link check happens once per merge, before any tag is cut. We
    # gate it off windows-latest because that fallback runner is much weaker - a
    # full Release build there would dominate the run. release.yml still does the
    # full Release build end-to-end on tag push, so nothing is lost when the
    # fallback skips it.
    - name: Configure CMake (Release)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.environment == 'self-hosted'
      run: |
        cmake -B build-release -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DMAGDA_BUILD_TESTS=OFF `
          ${{ steps.deps-cache.outputs.lua_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_LUA={0}', steps.deps-cache.outputs.lua_dir) || '' }} `
          ${{ steps.deps-cache.outputs.sqlite_dir != '' && format('-DFETCHCONTENT_SOURCE_DIR_SQLITE3={0}', steps.deps-cache.outputs.sqlite_dir) || '' }} `
          "-DCMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" `
          "-DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          ${{ steps.dsp-prebuilt-self.outputs.faust_release_hit == 'true' && format('-DMAGDA_FAUST_PREBUILT_DIR={0}', steps.dsp-prebuilt-self.outputs.faust_release_dir) || '' }} `
          ${{ steps.dsp-prebuilt-self.outputs.mutable_release_hit == 'true' && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}', steps.dsp-prebuilt-self.outputs.mutable_release_dir) || '' }}

    - name: Build (Release)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.environment == 'self-hosted'
      run: cmake --build build-release --config Release

    - name: Populate prebuilt Faust/Mutable cache (Release, self-hosted)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.environment == 'self-hosted'
      shell: powershell
      run: |
        if ("${{ steps.dsp-prebuilt-self.outputs.faust_release_hit }}" -ne "true" -and (Test-Path "third_party\faust\build\bin") -and (Test-Path "third_party\faust\build\lib")) {
          New-Item -ItemType Directory -Force -Path "${{ steps.dsp-prebuilt-self.outputs.faust_release_dir }}" | Out-Null
          Copy-Item -Recurse -Force "third_party\faust\build\bin" "${{ steps.dsp-prebuilt-self.outputs.faust_release_dir }}\"
          Copy-Item -Recurse -Force "third_party\faust\build\lib" "${{ steps.dsp-prebuilt-self.outputs.faust_release_dir }}\"
        }
        if ("${{ steps.dsp-prebuilt-self.outputs.mutable_release_hit }}" -ne "true" -and (Test-Path "third_party\eurorack\build\lib")) {
          New-Item -ItemType Directory -Force -Path "${{ steps.dsp-prebuilt-self.outputs.mutable_release_dir }}" | Out-Null
          Copy-Item -Recurse -Force "third_party\eurorack\build\lib" "${{ steps.dsp-prebuilt-self.outputs.mutable_release_dir }}\"
        }

    - name: Verify executable
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.environment == 'self-hosted'
      run: |
        $exe = Get-ChildItem -Path build-release -Recurse -Filter "MAGDA.exe" | Select-Object -First 1
        if ($exe) {
          Write-Output "✅ MAGDA.exe built successfully at $($exe.FullName)"
        } else {
          Write-Error "MAGDA.exe not found"
          exit 1
        }

    # Keep build dirs on self-hosted so incremental builds work; only wipe on
    # GitHub-hosted runners where the VM is thrown away anyway.
    - name: Clean up build directories
      if: always() && runner.environment == 'github-hosted'
      run: |
        Remove-Item -Recurse -Force build-debug -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force build-release -ErrorAction SilentlyContinue

    - name: Build summary
      if: success()
      run: Write-Output "✅ Windows build and tests completed successfully"
