name: JUCE Tests (Linux)

on:
  push:
    # Never run on the Crowdin localization branch (see ci.yml for the rationale):
    # the sync force-pushes onto the latest HEAD, so paths-ignore can't catch it.
    # 'dependabot/**' so Dependabot bumps never auto-start these tests; run via
    # workflow_dispatch when validating a bump.
    branches-ignore: [ 'l10n_crowdin_**', 'dependabot/**' ]
    tags-ignore: [ '**' ]
    paths-ignore:
      - 'lang/**'
      - 'manual/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  juce-tests-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    # First step on purpose: this decides whether the whole job builds warm or
    # cold, so it belongs where it is visible without scrolling past the apt
    # output, and a credential problem surfaces before any setup time is spent.
    # Needs neither the checkout nor any package.
    - name: Check R2 credentials
      id: r2-creds
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      run: test -n "$R2_ACCESS_KEY_ID"

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev \
          xvfb

    # Compile cache: sccache backed by Cloudflare R2 (see infra/sccache),
    # sharing the linux key prefix with the main CI job so common translation
    # units hit. R2 rather than S3 because these runners are GitHub-hosted, so
    # every cache hit left AWS as billed egress; R2 charges nothing for it.
    #
    # R2 has no OIDC federation, so this uses a scoped API token instead of an
    # assumed role. Dependabot-triggered runs get no repo secrets, so the
    # first-step credential check fails and the build just runs cold (see the
    # sccache-gated launcher flags in Configure CMake below).
    - name: Setup sccache
      id: sccache
      if: steps.r2-creds.outcome == 'success'
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        SCCACHE_VERSION=v0.8.1
        curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
        sudo mv sccache-*/sccache /usr/local/bin/sccache
        sccache --version
        # sccache reads R2 through its S3 backend: bucket + custom endpoint,
        # region 'auto' (R2 has no regions), credentials via the standard AWS
        # variables. Written to GITHUB_ENV so the compile steps see them too.
        {
          echo "SCCACHE_BUCKET=${R2_BUCKET}"
          echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "SCCACHE_REGION=auto"
          echo "SCCACHE_S3_KEY_PREFIX=linux"
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
        } >> "$GITHUB_ENV"

    # Faust/Mutable prebuilt artifacts (#1669): magda_juce_tests links magda_daw
    # for its JUCE UI/audio-driver coverage, not for Faust/Mutable DSP, but it
    # inherits their full source builds anyway. Cache the final build outputs
    # (fixed, submodule-relative paths - see the top-level CMakeLists.txt) keyed
    # on the exact submodule revision + compiler + backend/build-type, with no
    # restore-keys fallback: an approximate match could silently restore an
    # artifact built with a different ABI, which is worse than a rebuild.
    - name: Determine Faust/Mutable artifact cache keys
      id: dsp-cache-keys
      run: |
        echo "faust_sha=$(git -C third_party/faust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "eurorack_sha=$(git -C third_party/eurorack rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(cc --version | head -n1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Cache prebuilt Faust artifact
      id: faust-cache
      uses: actions/cache@v6
      with:
        path: |
          third_party/faust/build/bin
          third_party/faust/build/lib
        key: ${{ runner.os }}-faust-artifact-${{ steps.dsp-cache-keys.outputs.faust_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-wasm-debug

    - name: Cache prebuilt Mutable artifact
      id: mutable-cache
      uses: actions/cache@v6
      with:
        path: third_party/eurorack/build/lib
        key: ${{ runner.os }}-mutable-artifact-${{ steps.dsp-cache-keys.outputs.eurorack_sha }}-${{ steps.dsp-cache-keys.outputs.compiler }}-debug

    - name: Configure CMake
      run: |
        "$GITHUB_WORKSPACE/scripts/ci-retry.sh" cmake -B build-juce -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DMAGDA_BUILD_TESTS=ON \
          -DMAGDA_PRO_DEVICES=ON \
          "-DCMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" \
          "-DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}" \
          ${{ steps.faust-cache.outputs.cache-hit == 'true' && format('-DMAGDA_FAUST_PREBUILT_DIR={0}/third_party/faust/build', github.workspace) || '' }} \
          ${{ steps.mutable-cache.outputs.cache-hit == 'true' && format('-DMAGDA_MUTABLE_PREBUILT_DIR={0}/third_party/eurorack/build', github.workspace) || '' }}

    - name: Build JUCE tests
      run: cmake --build build-juce --target magda_juce_tests --config Debug -j$(nproc)

    - name: Run JUCE tests
      run: |
        JUCE_TEST_BIN=$(find build-juce -name "magda_juce_tests" -type f | head -1)
        if [ -z "$JUCE_TEST_BIN" ]; then
          echo "magda_juce_tests executable not found"
          exit 1
        fi

        # Async work can otherwise leak across shared-engine suites and only
        # manifest intermittently. Repeating the same process catches those
        # cross-test lifetime regressions before they land.
        #
        # The ten repetitions are independent samples, so they run
        # concurrently: sequentially they took 16m35s of a 24-minute job.
        # Explicit --server-num per run, because concurrent xvfb-run -a
        # instances race for the same display number.
        outdir=$(mktemp -d)
        for run in $(seq 1 10); do
          (
            xvfb-run -a --server-num=$((90 + run)) "$JUCE_TEST_BIN" \
              > "${outdir}/run-${run}.log" 2>&1
            echo $? > "${outdir}/run-${run}.rc"
          ) &
        done

        while true; do
          finished=$(ls "${outdir}"/run-*.rc 2>/dev/null | wc -l)
          echo "${finished}/10 runs finished"
          [ "$finished" -eq 10 ] && break
          sleep 15
        done
        wait

        failed=0
        for run in $(seq 1 10); do
          rc=$(cat "${outdir}/run-${run}.rc")
          echo "===== JUCE test run ${run}/10 (exit ${rc}) ====="
          cat "${outdir}/run-${run}.log"
          [ "$rc" -ne 0 ] && failed=$((failed + 1))
        done
        if [ "$failed" -gt 0 ]; then
          echo "${failed} of 10 JUCE test runs failed"
          exit 1
        fi

    - name: Show sccache statistics
      if: steps.sccache.outcome == 'success'
      run: sccache --show-stats
