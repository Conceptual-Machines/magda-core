site_name: MAGDA Manual
site_description: User manual for MAGDA — a free, open-source digital audio workstation
site_url: https://docs.magda.land/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  logo: assets/images/magda-lisa.svg
  favicon: assets/images/magda-icon.svg
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/Conceptual-Machines/magda-core
repo_name: magda-core

nav:
  - Home: index.md
  - Is MAGDA Right for You?: is-magda-right-for-you.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Session: getting-started/first-session.md
      - Localization: localization.md
  - Interface Layout:
      - Overview: interface/overview.md
      - Menus: interface/menus.md
      - Settings: interface/preferences.md
      - Audio & MIDI: interface/audio-settings.md
      - Controllers: interface/controllers.md
      - Connections: interface/connections.md
      - Plugins: interface/plugin-settings.md
      - AI: interface/ai-settings.md
  - Tracks: tracks.md
  - Clips: clips.md
  - Stem Separation: stem-separation.md
  - FX Chain & Racks: fx-chain.md
  - Plugin Parameters: plugin-parameters.md
  - ARA Plugins: ara.md
  - Arrangement View: arrangement-view.md
  - Session View: session-view.md
  - Mixer View: mixer-view.md
  - Recording & Comping: recording-comping.md
  - Exporting: exporting.md
  - Chord Track: chord-track.md
  - Working with AI: working-with-ai.md
  - Panels:
      - Inspector: panels/inspector.md
      - Plugin & Media Browser: panels/browsers.md
      - Media Library: panels/media-library.md
      - AI Assistant: panels/ai-assistant.md
      - Editors:
          - Overview: panels/editors.md
          - Piano Roll: panels/piano-roll.md
          - Drum Grid Editor: panels/drum-grid-editor.md
          - Waveform Editor: panels/waveform-editor.md
          - Track Chain: panels/track-chain.md
      - Chord Panel: panels/chord-panel.md
  - Devices:
      - Overview: devices/built-in.md
      - MIDI Devices:
          - Arpeggiator: devices/arpeggiator.md
          - Strum: devices/strum.md
          - Chord Engine: devices/chord-engine.md
          - Step Sequencer: devices/step-sequencer.md
          - Poly Sequencer: devices/poly-sequencer.md
      - Instruments:
          - Poly Synth: devices/poly-synth.md
          - FM0: devices/fm0.md
          - Drum Kit: devices/drum-kit.md
          - Physical Models: devices/physical-models.md
          - Mutable Ports: devices/mutable.md
          - Drum Grid: devices/drum-grid.md
          - Sampler: devices/sampler.md
          - Faust Instrument: devices/faust-instrument.md
      - Effects: devices/effects.md
      - Analysis: devices/analysis.md
  - Modulation:
      - Overview: modulation/overview.md
      - Modulators: modulation/modulators.md
      - Macros: modulation/macros.md
      - Linking Parameters: modulation/linking.md
  - Automation: automation.md
  - Time Bend: time-bend.md
  - Transport: transport.md
  - Reference:
      - Remote API: reference/remote-api.md
      - DSL Reference: reference/dsl.md
      - Controller Profile Format: reference/controller-profile-format.md
      - OSC Address Reference: reference/osc-addresses.md
      - Lua Scripting: reference/lua-scripting.md
      - Keyboard Shortcuts: reference/keyboard-shortcuts.md
      - File Formats: reference/file-formats.md
      - Project Migrations: reference/project-migrations.md
      - Troubleshooting: reference/troubleshooting.md

extra:
  homepage: https://magda.land
  # The site's shared header; point it at a local magda-cloud dev server to preview changes.
  site_header_js: !ENV [SITE_HEADER_JS, "https://magda.land/site-header.js"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Conceptual-Machines/magda-core
    - icon: fontawesome/solid/globe
      link: https://magda.land
      name: MAGDA Website

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site-header.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - toc:
      permalink: true
